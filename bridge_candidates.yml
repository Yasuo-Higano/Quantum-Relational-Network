# ---- HOLD-5 生成器の凍結 (走行は v29.3 以降。生成分布・分割・seed 規則を先に固定) ----
hold5_generator:
  family: "不均一 1 次元 Dirac 系 — 滑らかな正値速度プロファイル v(x)"
  profile: "v(x) = 1 + Σ_{k=1..K} A_k exp(−((x−c_k)/w_k)²)。K ∈ {3,4,5}・A_k ∈ [−0.3, 0.4] (v(x) > 0.5 を保証するよう棄却サンプル)・w_k ∈ [8, 20]・c_k は一様 — 全て instance seed から決定"
  regulators:
  - "R-A: 単鎖 (ボンド x,x+1 のホッピング t = v(x+1/2)/2, N = 128)"
  - "R-B: 同一 v(x) の細分格子 (a → a/2, 2N サイト — ボンド t = v/2 を物理位置で評価)"
  - "R-C: Wilson 2 成分鎖 (同一 v(x) を sin 項の係数に, r = 1, N = 128)"
  masses: "m_phys·a ∈ {0, 0.05}"
  topology: "リング/開放端の両方 (instance seed の 1 bit で決定)"
  seed_rule: "instance seed (u64) = sha256(SECRET + \":\" + instance_id) の先頭 8 バイト (big-endian)。instance_id = \"train-0\"..\"train-3\" / \"val-4\"..\"val-7\" / \"hold-8\"..\"hold-15\""
  seed_commitment_sha256: "cfeb1959f3ba63b17c8ea7d1261f0f24570d33f7f8a2b3956a3df761bd301ab2"
  disclosure: "SECRET は holdout 走行版の結果公開と同時に文書へ開示する — 第三者がコミットメントと全生成系列を検証できる。開示までリポジトリに SECRET を置かない"
  split: "train-0..3 = 設計・較正可 / val-4..7 = 中間確認 (1 回) / hold-8..15 = 走行版まで生成すらしない"
  scoring_v294: "静的核の再構成距離 d_S が、未使用の摂動源・未使用時刻系列の動的到着時刻 τ(x,y) ≈ Σ_bonds 1/v を無調整で予言すること。距離一致は Δ∞(d₁, d₂) = inf_{α>0} max_{i<j} |ln(d₁(i,j)/(α·d₂(i,j)))| で採点 (置換は採点側の逆写像で固定・全体スケール α のみ自由)。バー値は v29.3/29.4 の凍結時に導出して事前登録する (結果を見てから決めない)"

