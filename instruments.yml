# =====================================================================
# QRN 器械台帳 (Instrument Registry) — v27.3 で凍結 (PROMPT/10 §5)
# =====================================================================
# uft-v27.0.md §D.3 の成果物の正名 = QRN-Matter-on-Background Adapter v1 (family:
# adapter — 外部計量と物質の結合規約) + QRN-Metrology Suite v1 (family: metrology —
# 較正済み測定器)。各器械に入出力型・規格化・regulator・連続極限契約・較正記録・
# 陰性対照・既知の故障モード・許される主張・禁止される解釈・認証ファイルの
# SHA-256 (先頭 16 桁) を登録する。sim/src/bin/v273_instruments.rs が機械検証:
#   - concept は core.schema.yml の同名概念と層が一致すること (adapter/instrument)
#   - certificate_code の sha256 先頭 16 桁が記録と一致すること (器械の無断変更検出)
#   - allowed_claims の id が claims.yml に実在すること
#   - forbidden_interpretations が空でないこと
# 恒久解釈 (spec §12.8/§13.3): 全器械の成果は「測定器が正しい」ことの証明であり、
# QRN・創発重力の証拠ではない。
# =====================================================================

