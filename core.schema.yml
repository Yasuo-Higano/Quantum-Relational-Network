- from: ParentModularGenerator
  to: PhysicalGenerator
  reason: "Gibbs 出自と Gaussian 性の証拠なしに親モジュラー生成子を物理生成子と同一視しない (v31.0 禁止変換 8 — 唯一の門は identify_physical_generator)"
- from: RegularizedCorrelation
  to: ExactFullRankCorrelation
  reason: "clamp/正則化した相関から exact 識別可能性証明書を発行しない (v31.0 禁止変換 9 — 現行 B2 の eigenvalue clamp は estimate lane 専用)"
- from: OraclePatch
  to: OperationalPatch
  reason: "真の幾何半径で選んだ patch を操作的読み出しと偽装しない (v31.0 禁止変換 10 — 循環防止。OraclePatch は診断専用)"
- from: GlobalClosure
  to: OperationalNet
  reason: "閉包は marking を消す — site 生成族も mode 生成族も同じ B(H) に閉じるため、大域代数の同型類から因子分解・操作文脈へ戻る経路は存在しない (v32.2 禁止変換 11 — global-algebra erasure no-go の型化。復元の入力は marked OperationalNet のみ)"

