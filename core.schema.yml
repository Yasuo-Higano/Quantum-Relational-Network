axis_universality: [not_applicable, regulator_specific, scheme_dependent, continuum_universal, unknown]
axis_data_relation: [not_applicable, fitted, calibration_data_reused, preregistered_holdout, future_observation]
axis_physical_scope: [toy, effective_model, laboratory, natural]

