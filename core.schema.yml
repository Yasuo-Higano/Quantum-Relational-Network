  status: defined
  note: "成分対の共同 addressability の操作的証人 (v33.1) — 唯一の構成は宣言済み操作文脈の共有 (OperationalNet::joint_context_witness)。CertifiedCommutator (代数的可換性) からの変換は存在しない (禁止変換 12)。証人不在の成分対を持つ復元は Abstain(OperationalCompatibilityUnwitnessed)"
- name: HamiltonianCommutatorLiouvillian
  layer: dynamics
  status: defined
  note: "L = −i[H,·] (Schrödinger 規約) の型 (v33.1) — v32.4 応答恒等式 R⁽¹⁾/R⁽²⁾ の資格域はこの lane に限る。資格審査は導分 (Leibniz) 証明書 (classify_generator)。GklsLiouvillian への変換は存在しない (禁止変換 13)"
- name: GklsLiouvillian
  layer: dynamics
  status: defined
  note: "GKLS 生成子 L(ρ) = −i[H,ρ] + Σ γ_μ (L_μ ρ L_μ† − ½{L_μ†L_μ, ρ}) の型 (v33.1) — γ_μ ≥ 0 を構成時資格審査。v32.4 恒等式の資格域外 (dissipator は Leibniz を破る — v331 [B5] が γ 比例の破れと R⁽¹⁾ 公式の不成立を実測)。一般 GKLS の応答理論 (jump 表現の gauge を含む) は未構成 — 次々期の独立テーマ"
# ---- v33.2 (PROMPT/14): Certified Laboratory Interface ----
- name: DeclaredOperation
  layer: core
  status: defined
  note: "宣言された操作 = 行列 + 意図のみで**資格なし** (v33.2)。AccessibleOperation への直接変換は存在しない (禁止変換 14) — 通過できる門は較正・合成・トモグラフィの 3 出自証明書のみ"
- name: AccessibleOperation
  layer: core
  status: defined
  note: "資格つき操作 (v33.2) — 役割 (OpKind)・出自 (OperationOrigin)・独立 addressability・資源予算を運ぶ。構成は certify のみで、出自証明書の対象 sha256 が行列と一致しない場合 (証明書の流用) は構成時拒否"
- name: OperationOrigin
  layer: core
  status: defined
  note: "操作の出自 3 種 (DirectlyCalibrated / Synthesized / TomographicallyInferred) — 文字列 provenance の廃止 (v33.2): 出自は型と sha256 結束の証明書で運ぶ。旧 PrimitiveOperation.provenance 文字列は v32.2 凍結層の legacy フィールド (新 lane では定数で中立化)"
- name: IndependentAddressabilityCertificate
  layer: instrument
  status: defined
  note: "独立 addressability の証明書 (v33.2) — command Jacobian の証明つき rank・最小特異値区間・cross-talk 区間・較正記録 sha256。同一 command を複数標的に割り当てる「数学的分解」は rank 不足で構成時拒否 (禁止変換 15 の執行点)。cross-talk 区間のバー跨ぎは Straddled 拒否 (強制判定の禁止)"
- name: SynthesisCertificate
  layer: instrument
  status: defined
  note: "合成の証明書 (v33.2) — 較正済み生成子からの bracket/線形結合の列を機械実行して検証 (「レシピの主張」ではなく実行結果が資格)。深さ・残差区間・列の sha256 を記録し対象行列に結束"
- name: TomographyCertificate
  layer: instrument
  status: defined
  note: "トモグラフィ出自の証明書 (v33.2) — 情報完全状態族 (design 行列の σ_min 資格) からの線形再構成・残差区間・データ sha256。残差バー超過・effect 資格 (0 ≤ E ≤ I) 不通過は拒否"
- name: ResourceBudget
  layer: core
  status: defined
  note: "資源予算 5 成分 (時間・振幅・帯域・深さ・誤差) — **成分ごとの半順序のみ** (v33.2): Ord/PartialOrd を実装しない (恣意的な重み付き和での全順序化は新しい選択バイアス)。v33.3 resource-indexed factorization profile の土台"
- name: ControlContext
  layer: core
  status: defined
  note: "制御文脈 (v33.2) — 独立 addressability 証明書を要求する role-typed 文脈。可換性 (CertifiedCommutator) だけでは構成できない"
- name: MeasurementContext
  layer: core
  status: defined
  note: "測定文脈 (v33.2) — joint measurability 証明書を要求する role-typed 文脈。**可換性より広い** (非可換 unsharp 対も共同測定可能) — 因子分解への統合は v33.4"
- name: PreparationFamily
  layer: core
  status: defined
  note: "準備族 (v33.2) — 凸可達性証明書 (重みの機械検証) を要求する role-typed 文脈"
- name: DriftRegime
  layer: core
  status: defined
  note: "drift regime (v33.2) — 時間窓内の変動バー (安定性証明書) を要求する role-typed 文脈"
- name: JointMeasurementCertificate
  layer: instrument
  status: defined
  note: "joint measurability の証明書 (v33.2) — 明示的 joint POVM の機械検証 (各元 PSD・総和 I・marginal 一致)。非可換 unsharp 対 η = 0.6 は資格・η = 0.8 は正値性破れで拒否 (不偏 qubit 対の canonical 構成 = Busch の iff の器械化)。CertifiedCommutator からの変換は存在しない (禁止変換 16)"
- name: AccessibleOperationalNet
  layer: core
  status: defined
  note: "資格つき操作だけで構成される operational net (v33.2) — DeclaredOperation を受け付ける口は存在しない。制御文脈は addressability 証明書つきで下層 OperationalNet (v32.2/v33.1 契約) に降り、v33.1 修復入口で復元する。測定文脈・準備族・drift regime は型つき保持 (統合は v33.4)"
# ---- v33.3 (PROMPT/14): Resource-Filtered OperationalNet ----
- name: ResourceFilteredInterface
  layer: core
  status: defined
  note: "資格つき操作 (コスト = ResourceBudget) と文脈レシピの族 (v33.3) — budget b での accessible 部分 interface = {op : cost ≤ b 成分ごと} から AccessibleOperationalNet を組み v33.1 入口で読む。資格のない操作は budget をいくら積んでも accessible にならない (禁止変換 14 の維持)"
- name: OperationalFactorizationProfile
  layer: core
  status: defined
  note: "有限 poset (budget grid) 上の constructible profile: ResourceBudget ↦ 読み (v33.3)。**barcode ではない** — 比較不能な budget 対が同 dims で別 gauge orbit を持ち得る (v333 [R2])。頂の読みだけを見ると v32.2 erasure no-go に戻る (profile が経路を運ぶ — [R5])"
- name: ProfilePoint
  layer: core
  status: defined
  note: "budget 1 点での profile の値 3 種 (v33.3): NoAccessibleOperations (資源不足の正直な記録) / InputRejected (構成時拒否 — Abstain と区別) / Reading (三値裁定 + orbit 照合材料)"
- name: StableFactorizationRegion
  layer: core
  status: defined
  note: "昇格可能な局所性 (v33.3 凍結規則): (読み + gauge orbit) の同値クラスの領域に**比較可能な対 (chain ≥ 2) が存在する**こと。単一閾値で一瞬だけ出現した読み (単点領域 = transient) は昇格しない (禁止変換 17)。grid の頂・縁で切れる読みは調査 grid 相対で transient と正直に記録"
# ---- v33.4 (PROMPT/14): Contextual factorization ----
- name: ChartSpec
  layer: core
  status: defined
  note: "実験者が宣言する持ち場 (chart) = net の primitive の部分集合 (v33.4)。実験室は chart の集まりで、全系を一望する制御器は仮定しない"
- name: ChartLocalFactorization
  layer: core
  status: defined
  note: "chart 局所復元の結果 (v33.4) — 自分の持ち場の因子 (次元・部分代数・構成 primitive) しか語らない。GlobalFactorization への変換は存在しない (禁止変換 19)。局所復元は成分 → chart 内証人ゲート (v33.1 の局所版) → 成分閉包の factor 資格 (証明書は大域 net から継承 — 再計算しない)"
- name: AtlasReading
  layer: core
  status: defined
  note: "atlas glue の裁定 (v33.4 凍結手順): 連結成分対 (共有 primitive ∨ 交差 NonCommuting) の部分代数 matching が全整合 + 被覆 Π d = n + 大域証人 → GluedExact (v334 [A1] が直接大域復元との読み・orbit 一致 = glue 定理を機械照合) / matching 破れでも全被覆の整合 chart 群が 2 つ以上 → EquivalenceClassOnly / それ以外 → Abstain (ChartFailed・GlueInconsistent・CoverageIncomplete・CompatibilityUnwitnessed)。宣言 chart を黙って捨てない"

forbidden_conversions:
- from: RegulatorSiteId
  to: RelationalNodeId
  reason: "格子由来の構造の観測を『自然が量子ネットワークである証拠』に昇格させない"
- from: EvolutionParameter
  to: ProperTime
  reason: "外部発展パラメータを創発時間と同一視しない (A1 の先取り禁止)"
- from: ExternalMetricSource
  to: EmergentMetricCandidate
  reason: "external metric response ≠ emergent metric (v27.0 fork の凍結解釈)"
- from: CalibrationEvidence
  to: QrnEvidence
  reason: "較正・測定器の証明は QRN の証拠でない (spec §12.8)"
- from: InternalPrediction
  to: NaturalObservation
  reason: "計算実験内の的中は自然の観測量の的中でない (README PASS 分類)"
- from: SameAuthorReplication
  to: IndependentReplication
  reason: "同一作者・同一 AI の別言語再実装は algorithmic diversity どまり (v27.4 replications.yml)"
- from: RegulatorQuantity
  to: UniversalQuantity
  reason: "bare c₁/c₂ 型の a 走行量は scheme 量 (v27.0-C: 比 4.000 = a⁻²)"
- from: ParentModularGenerator
  to: PhysicalGenerator
  reason: "Gibbs 出自と Gaussian 性の証拠なしに親モジュラー生成子を物理生成子と同一視しない (v31.0 禁止変換 8 — 唯一の門は identify_physical_generator)"
- from: RegularizedCorrelation
  to: ExactFullRankCorrelation
  reason: "clamp/正則化した相関から exact 識別可能性証明書を発行しない (v31.0 禁止変換 9 — 現行 B2 の eigenvalue clamp は estimate lane 専用)"
- from: OraclePatch
  to: OperationalPatch
  reason: "真の幾何半径で選んだ patch を操作的読み出しと偽装しない (v31.0 禁止変換 10 — 循環防止。OraclePatch は診断専用)"
- from: GlobalClosure
  to: OperationalNet
  reason: "閉包は marking を消す — site 生成族も mode 生成族も同じ B(H) に閉じるため、大域代数の同型類から因子分解・操作文脈へ戻る経路は存在しない (v32.2 禁止変換 11 — global-algebra erasure no-go の型化。復元の入力は marked OperationalNet のみ)"
- from: CertifiedCommutator
  to: JointContextWitness
  reason: "代数的可換性 (bracket ノルムの区間証明書) から操作的両立性 (共同 addressability) への暗黙昇格を作らない — 一般 POVM の joint measurability は可換性で特徴づけられず、可換な作用素対が同一実験文脈で共同実行可能とは限らない (v33.1 禁止変換 12)。JointContextWitness の唯一の構成は宣言済み操作文脈の共有で、証人不在は Abstain(OperationalCompatibilityUnwitnessed) — v331 [B4] が全対 Commuting 証明書つきの singleton 文脈 net で機械実証"
- from: HamiltonianCommutatorLiouvillian
  to: GklsLiouvillian
  reason: "可換子 lane の応答恒等式 (v32.4 R⁽¹⁾/R⁽²⁾) の証明書を一般 GKLS 生成子へ昇格しない — dissipator は Leibniz (導分性) を破り (γ 比例)、R⁽¹⁾ = −i Tr(B[H,A]) は GKLS 測定と一致しない (v33.1 禁止変換 13 — v331 [B5] が γ = 0.3 で乖離 1.2・γ = 0 で ≤ 1e-6 への回復を実測)。lane の資格審査は導分証明書 (classify_generator) のみ"
- from: DeclaredOperation
  to: AccessibleOperation
  reason: "宣言 (行列 + 意図) は資格ではない — accessible operations の出自は較正・合成・トモグラフィの 3 証明書のみが与える (v33.2 禁止変換 14)。証明書は対象行列の sha256 に結束され、別の行列への流用は CertificateTargetMismatch で構成時拒否 (v332 [C1])"
- from: OperatorDecomposition
  to: IndependentlyAddressablePrimitives
  reason: "装置が u(t)(X₁+X₂) しか操作できないとき、行列を X₁ と X₂ に数学的分解して「二つの独立 primitive」と扱わない (v33.2 禁止変換 15) — 同一 command を複数標的に割り当てる較正は command Jacobian rank 不足で構成時拒否 (v332 [C3]: rank 1 < 2)。独立性が立たない装置の正直な net は Abstain。ただし bracket 合成路が実在すれば Synthesized として資格が立つ (v332 [C4] — 可アクセス性は interface との関係)"
- from: CertifiedCommutator
  to: JointMeasurementCertificate
  reason: "代数的可換性から role-typed 文脈証明書 (JointMeasurement / IndependentAddressability / ConvexReachability / Stability) への暗黙変換を作らない (v33.2 禁止変換 16 — 禁止変換 12 の役割別展開)。joint measurability は可換性で特徴づけられない: 非可換な unsharp 対 (η = 0.6, ‖[E,F]‖ = 0.25) が明示的 joint POVM で資格を通り、η = 0.8 は正値性破れで拒否される (v332 [C6] — 不偏 qubit 対の canonical 構成)"
- from: TransientFactorizationPoint
  to: StableFactorizationRegion
  reason: "単一閾値で一瞬だけ出現した因子分解を局所性に昇格しない (v33.3 禁止変換 17) — 昇格規則 (凍結) は「(読み + gauge orbit) の領域に比較可能な対 (chain ≥ 2) が存在」のみ。v333 [R3]: 深さ鎖 {1,1.5,2,3} で [2,2,2] は chain で stable・[2,4]@2 と [8]@3 は単点で transient (transient の昇格 0)。grid の頂で切れる読みも調査 grid 相対で transient と正直に記録する"
- from: ResourceBudget
  to: ScalarResourceCost
  reason: "資源予算の成分半順序を恣意的な重み付き和で全順序化しない (v33.3 禁止変換 18) — スカラー化は accessibility の集合を変え裁定を反転させる (v333 [R4]: amp+depth 潰しは budget (2,1) で E23 を accessible にし読みが [2,4] → [8] に反転)。許されるのは成分ごとの狭義単調再パラメータ化のみ (このとき profile は点ごとに不変 — command 再パラメータ化不変性)"
- from: ChartLocalFactorization
  to: GlobalFactorization
  reason: "chart の局所 Exact を大域因子分解に昇格しない (v33.4 禁止変換 19) — 大域は glue (overlap 上の部分代数 matching + 被覆 Π d = n + クラス対ごとの証人文脈) だけが与える。v334 [A3]: entangler W = CZ₂₃ で捻れた chart は A と局所 Exact 同士なのに matching (overlap 1/3) が破れ Abstain(GlueInconsistent) — 局所的に完全な 2 つの持ち場が大域構造を定めない実例"

