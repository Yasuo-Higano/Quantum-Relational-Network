# =====================================================================
# QRN 核意味論スキーマ (Core Semantic Schema) — v27.1 で導入 (PROMPT/10 §2)
# =====================================================================
# 「何が QRN 本体で、何が既知 QFT の測定器か」の機械可読な一次ソース。
#   - layers / axis_*: 層と多軸の語彙 (claims.yml の 6 軸は v61_ledger [7] が書式検査)
#   - status_*: QRN-Core v1 の状態表示 (docs/qrn-core-v1-spec.md §7 と一致すること)
#   - concepts: 全概念の層分類 (未分類 = layer: unclassified は v271_core_audit で FAIL)
#   - forbidden_conversions: 型レベルの禁止変換 (v27.2 で Rust 型化)
#   - predictions: predictions.yml の各 PRED の分類 (自然の的中 0 の機械監査に使う)
# 書式は制限 YAML — sim/src/bin/v271_core_audit.rs が解析・検証する。
# 人間向けの説明は docs/qrn-terminology.md / docs/qrn-core-v1-spec.md。
# =====================================================================

