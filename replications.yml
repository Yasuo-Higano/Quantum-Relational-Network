# =====================================================================
# 独立外部再現の台帳 (Replication Ledger) — v27.4 で導入 (PROMPT/10 §6)
# =====================================================================
# reproducer/ (SPEC.md / TOLERANCES.yml / CLAIMS.md / NO_SHARED_CODE.md) の
# 再現報告をここに登録する。sim/src/bin/v274_reproducer.rs が機械検証:
#   - criteria の 6 条件が定義されていること
#   - entries の各報告が 6 条件の真偽と結果を明示していること
#   - 6 条件を全て満たす entries の数 = external_replications
#   - external_replications = claims.yml の evidence_kind: external_replication
#     の件数と一致すること (現在どちらも 0 — 昇格は CLAIMS.md の手続きのみ)
# 失敗・不一致の報告も status: failed で登録する (削除しない)。
# =====================================================================

version: "v27.4"

criteria: [different_author, independent_repository, no_shared_numerical_kernel, protocol_frozen_before_run, commit_hash_recorded, result_including_failures_public]

external_replications: 0

algorithmic_diversity_note: "同一作者・同一 AI・同一数値カーネルの別言語実装は algorithmic diversity であり、ここに登録しても external_replications に数えない (NO_SHARED_CODE.md)"

# =====================================================================
# v31.0 拡張 (PROMPT/12 Track X): claim/capability scoped 台帳
# =====================================================================
# 総数 (external_replications) だけでは「どの主張のどの能力が再現されたか」を
# 区別できない — gauge の Unit A 成功が geometry 能力の blocker を解除する誤読を
# 型で封じる。単位と能力の対応:
#   Unit A/B/C = gauge 全数定理 / vacuum-polarization 区間 / one-loop oracle 系の
#                claim 専用。geometry 系能力には効力を持たない。
#   Unit D (Geometry Identifiability) = D1 凍結 C 行列の kernel/readout 数値再現 /
#     D2 独立モデル生成・独立 state solver・独立 readout の end-to-end /
#     D3 負定理 (P6/693 衝突・projector 同値類・factorization 非一意性) の独立確認 /
#     D4 LocalBiasCurvatureLaw の独立実装。
#   geometry 系能力 (spatial_topology_given_factorization 等) の blocker 解除 =
#   **対応する claim を scope に含む D2 の 6 条件成立のみ** (D1 は数値再現どまり)。
capability_scope_version: "v31.0"
unit_capability_note: "unit A/B/C は geometry 能力の blocker を解除しない — geometry の登録条件は matching Unit D2 (v32.1 以降は D2-R lane) のみ (v310_readout_semantics が常設監査)"

