# =====================================================================
# v34.1: 多次元独立性 profile (PROMPT/15 §2)
# =====================================================================
# 「独立か否か」の一次元分類は情報を失う — 第三十三期テーゼ (可アクセス性は
# 対象単体の属性ではなく関係である) を再現の独立性にも適用し、entries に
# 以下の profile フィールドを追加する (v274 [P4] の 6 条件・external 計数は不変):
#   replication_kind: same_implementation | algorithmically_diverse |
#                     cross_model_clean_room | organizationally_external
#   human_operator: shared | different
#   implementation_agent: same_model | different_model | human
#   repository_independence: shared | independent
#   numerical_kernel: shared | independent
#   generator: shared | independent
#   freeze_before_holdout: true | false
#   secret_holder: 誰が SECRET を保持したか (自由文)
#   organization: not_external | external
#   verdict: replicated | partially_replicated | not_replicated
#   counts_as_external_replication: true | false  (6 条件全充足のときのみ true)
independence_profile_version: "v34.1"

